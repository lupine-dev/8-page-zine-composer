<!DOCTYPE html>
<html>
<head>
    <title>8-Page Zine Stitcher</title>
    <link rel="stylesheet" href="src/pico.min.css">
    <link rel="stylesheet" href="src/zine.css">
</head>
<body>
    <h1>8-Page Zine Stitcher</h1>
    <img src="src/zine-layout.svg" width="800" height="400">
    <div id="fileInputs">
        <div>Page 1 (Front Cover):</div><input type="file" accept="image/*">
        <div>Page 2:</div><input type="file" accept="image/*">
        <div>Page 3:</div><input type="file" accept="image/*">
        <div>Page 4:</div><input type="file" accept="image/*">
        <div>Page 5:</div><input type="file" accept="image/*">
        <div>Page 6:</div><input type="file" accept="image/*">
        <div>Page 7:</div><input type="file" accept="image/*">
        <div>Page 8 (Back Cover):</div><input type="file" accept="image/*">
    </div>
    <button id="processBtn">Process</button>
    <br><br>
    <div id="resultContainer">
        <img id="resultImage" />
        <a role="button" id="downloadLink">Download Result</a>
    </div>

    <script type="module" src="src/index.js"></script>
</body>
</html>
